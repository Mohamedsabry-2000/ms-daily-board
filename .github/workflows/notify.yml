name: MS Task Notifications

on:
  schedule:
    # بيتشغل كل 15 دقيقة (توقيت UTC، مش محتاج تغيّر حاجة بسبب فرق التوقيت)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # بيسمحلك تشغّله يدويًا من تبويب Actions لو حبيت تجربه فورًا

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run notification check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node notify.js
